# Sobe um MySQL local para desenvolvimento: docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: fazenda-abacaxi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fazenda_abacaxi
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
